# mediamtx.yml

logLevel: info
logDestinations: [stdout]


api: true
apiAddress: :9997


rtsp: true
rtspAddress: :8554
rtspTransports: [tcp]


webrtc: true
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]

# Important for cloud deployment.
# Replace with your real stream domain or Linode public IP.


# webrtcAdditionalHosts:
  # - stream.yourdomain.com

# WebRTC media UDP port.
webrtcLocalUDPAddress: :8189

# Optional HLS fallback. More latency than WebRTC.
hls: true
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsVariant: lowLatency


paths:
  cam-1:
    # source: rtsp://0HcBEGwT:yJeLShOlBlpuJOXN@192.168.178.25:554/live/ch0 
    source: rtsp://0HcBEGwT:yJeLShOlBlpuJOXN@192.168.178.25:554/live/ch1 
    rtspTransport: tcp

  # cam-2:
  #   source: rtsp://USERNAME:PASSWORD@CAMERA_HOST_OR_IP:554/stream1
  #   rtspTransport: tcp

  # cam-3:
  #   source: rtsp://USERNAME:PASSWORD@CAMERA_HOST_OR_IP:554/stream1
  #   rtspTransport: tcp