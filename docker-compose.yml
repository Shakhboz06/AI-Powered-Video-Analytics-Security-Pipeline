version: '3.8'

services:
  ## ────────────────────────────────────
  ## ZooKeeper
  ## ────────────────────────────────────
  zookeeper:
    image: bitnami/zookeeper:latest
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - '2181:2181'
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:12.0.0
    container_name: grafana
    depends_on:
      - influxdb
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "secret123admin"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
  ## ────────────────────────────────────
  ## Kafka
  ## ────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      # INTERNAL listener for in‑container apps, EXTERNAL for your host/browser UIs
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS:
        INTERNAL://kafka:9092,
        EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_MESSAGE_MAX_BYTES:       5000000
      KAFKA_REPLICA_FETCH_MAX_BYTES: 5000000
      KAFKA_FETCH_MAX_BYTES:         5000000
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/localhost/9092 && echo ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  ## ────────────────────────────────────
  ## Redis
  ## ────────────────────────────────────
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - '6379:6379'

  ## ────────────────────────────────────
  ## InfluxDB
  ## ────────────────────────────────────
  influxdb:
    image: influxdb:2.0
    container_name: influxdb
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpass
      - DOCKER_INFLUXDB_INIT_ORG=example_org
      - DOCKER_INFLUXDB_INIT_BUCKET=video_metrics
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=mysecrettoken123
    ports:
      - "8086:8086"


  # ────────────────────────────────────
  # Kafka Connect (for sinking video.enriched → InfluxDB)
  # ────────────────────────────────────
  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.5.0
    container_name: kafka-connect
    depends_on:
      - kafka
      - influxdb
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS:           kafka:9092
      CONNECT_REST_PORT:                   8083
      CONNECT_REST_ADVERTISED_HOST_NAME:   kafka-connect
      CONNECT_REST_ADVERTISED_PORT:        8083
      CONNECT_GROUP_ID:                    "connect-cluster"
      CONNECT_CONFIG_STORAGE_TOPIC:        "connect-configs"
      CONNECT_OFFSET_STORAGE_TOPIC:        "connect-offsets"
      CONNECT_STATUS_STORAGE_TOPIC:        "connect-status"
      CONNECT_KEY_CONVERTER:               "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_VALUE_CONVERTER:             "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE:   "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      ALLOW_PLAINTEXT_LISTENER: "yes"
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR:  1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR:  1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR:  1

  telegraf:
    image: telegraf:latest
    container_name: telegraf
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro

  ## ────────────────────────────────────
  ## Worker (Python)
  ## ────────────────────────────────────
  worker:
    build:
      context: ./worker
      dockerfile: worker.dockerfile
    container_name: worker
    env_file:
      - .env
    depends_on:
      - kafka

  ## ────────────────────────────────────
  ## Aggregator (Go)
  ## ────────────────────────────────────
  aggregator:
    build:
      context: .
      dockerfile: aggregator/aggregator.dockerfile
    container_name: aggregator
    env_file:
      - .env
    depends_on:
      - influxdb
      - redis
      - kafka

  ingestor:
    build:
      context: ./ingestor
      dockerfile: ingestor.dockerfile
    container_name: ingestor
    env_file:
      - .env
    volumes:
    - ./dev/videos:/videos
    depends_on:
      - kafka

  broker:
    build:
      context: .
      dockerfile: broker/broker.dockerfile
    container_name: broker
    env_file:
      - .env
    depends_on:
      - kafka

  dashboard-api:
    build:
      context: .
      dockerfile: dashboard/dashboard.dockerfile
    container_name: dashboard-api
    env_file:
      - .env
    depends_on:
      - influxdb
    ports:
      - "8081:8081"
  ## ────────────────────────────────────
  ## Conduktor Console & its DB
  ## ────────────────────────────────────
  postgresql:
    image: postgres:14
    container_name: conduktor-postgres
    hostname: postgresql
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: conduktor_console
      POSTGRES_USER: conduktor
      POSTGRES_PASSWORD: change_me
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduktor"]
      interval: 10s
      timeout: 5s
      retries: 5

  conduktor-console:
    image: conduktor/conduktor-console:1.36.0
    container_name: conduktor-console
    ports:
      - "8080:8080"  # Browse to http://localhost:8080
    volumes:
      - conduktor_data:/var/conduktor
    environment:
      CDK_ORGANIZATION_NAME:       "local-dev"
      CDK_DATABASE_URL:            "postgresql://conduktor:change_me@postgresql:5432/conduktor_console"
      CDK_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    depends_on:
      postgresql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", 'curl -f http://localhost:8080/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  conduktor_data:

networks:
  default:
    driver: bridge
