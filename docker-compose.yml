version: '3.8'

services:
  ## ────────────────────────────────────
  ## ZooKeeper
  ## ────────────────────────────────────
  zookeeper:
    image: bitnami/zookeeper:latest
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - '2181:2181'
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  ## ────────────────────────────────────
  ## Kafka
  ## ────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      # INTERNAL listener for in‑container apps, EXTERNAL for your host/browser UIs
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: |
        INTERNAL://kafka:9092,
        EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      - zookeeper
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/localhost/9092 && echo ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  ## ────────────────────────────────────
  ## Redis
  ## ────────────────────────────────────
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - '6379:6379'

  ## ────────────────────────────────────
  ## InfluxDB
  ## ────────────────────────────────────
  influxdb:
    image: influxdb:2.0
    container_name: influxdb
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpass
      - DOCKER_INFLUXDB_INIT_ORG=example_org
      - DOCKER_INFLUXDB_INIT_BUCKET=video_metrics
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=mysecrettoken123
    ports:
      - "8086:8086"

  ## ────────────────────────────────────
  ## Worker (Python)
  ## ────────────────────────────────────
  worker:
    build:
      context: ./worker
      dockerfile: worker.dockerfile
    container_name: worker
    env_file:
      - .env
    depends_on:
      - kafka

  ## ────────────────────────────────────
  ## Aggregator (Go)
  ## ────────────────────────────────────
  aggregator:
    build:
      context: .
      dockerfile: aggregator/aggregator.dockerfile
    container_name: aggregator
    env_file:
      - .env
    depends_on:
      - kafka
      - influxdb
      - redis

  ## ────────────────────────────────────
  ## Conduktor Console & its DB
  ## ────────────────────────────────────
  postgresql:
    image: postgres:14
    container_name: conduktor-postgres
    hostname: postgresql
    volumes:
      - pg_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: conduktor_console
      POSTGRES_USER: conduktor
      POSTGRES_PASSWORD: change_me
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduktor"]
      interval: 10s
      timeout: 5s
      retries: 5

  conduktor-console:
    image: conduktor/conduktor-console:1.36.0
    container_name: conduktor-console
    ports:
      - "8080:8080"  # Browse to http://localhost:8080
    volumes:
      - conduktor_data:/var/conduktor
    environment:
      CDK_ORGANIZATION_NAME:       "local-dev"
      CDK_DATABASE_URL:            "postgresql://conduktor:change_me@postgresql:5432/conduktor_console"
      CDK_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    depends_on:
      postgresql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", 'curl -f http://localhost:8080/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  conduktor_data:

networks:
  default:
    driver: bridge
